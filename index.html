<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Помощник самозанятого</title>
<style>
  /* === СТИЛИ === */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f5f6fa; color: #2c3e50; min-height: 100vh; }
  
  /* Экран входа */
  #login-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    z-index: 9999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: white;
  }
  #login-screen h2 { font-size: 32px; margin-bottom: 10px; }
  #login-screen input {
    padding: 14px; margin: 6px; width: 300px; max-width: 90vw;
    border: none; border-radius: 10px; font-size: 15px;
  }
  #login-screen button {
    padding: 14px 28px; margin: 6px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer; color: white;
  }
  .btn-login { background: #007bff; }
  .btn-register { background: #28a745; }
  
  /* Основной интерфейс */
  header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; padding: 20px; text-align: center; position: relative;
  }
  .user-bar { position: absolute; top: 15px; right: 20px; font-size: 13px; }
  .user-bar button { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  
  .tabs { display: flex; background: white; overflow-x: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .tab { padding: 14px 20px; cursor: pointer; border: none; background: none; font-size: 14px; color: #7f8c8d; border-bottom: 3px solid transparent; }
  .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
  
  .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #667eea; }
  .stat-card .value { font-size: 24px; font-weight: 700; }
  
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ecf0f1; font-size: 14px; }
  
  .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: #667eea; color: white; }
  .btn-danger { background: #e74c3c; color: white; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
  .modal.active { display: flex; }
  .modal-content { background: white; border-radius: 12px; padding: 25px; width: 90%; max-width: 500px; }
  
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; z-index: 2000; }
  .toast.green { background: #28a745; }
  .toast.red { background: #e74c3c; }
  
  .chat-messages { height: 300px; overflow-y: auto; padding: 15px; background: #f8f9fa; border-radius: 8px; margin-bottom: 15px; }
  .msg { margin-bottom: 10px; padding: 10px; border-radius: 8px; max-width: 80%; }
  .msg.user { background: #667eea; color: white; margin-left: auto; }
  .msg.bot { background: white; border: 1px solid #ddd; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="login-screen">
  <h2>💼 Помощник самозанятого</h2>
  <p style="margin-bottom: 20px;">Войдите или зарегистрируйтесь</p>
  <input type="email" id="login-email" placeholder="Email">
  <input type="password" id="login-pass" placeholder="Пароль">
  <div>
    <button class="btn-login" onclick="doLogin()">Войти</button>
    <button class="btn-register" onclick="doRegister()">Регистрация</button>
  </div>
</div>

<!-- САЙТ -->
<div id="app-content" style="display:none;">
  <header>
    <h1>💼 Самозанятый</h1>
    <div class="user-bar"><span id="user-email"></span> <button onclick="doLogout()">Выйти</button></div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard')">📊 Дашборд</button>
    <button class="tab" onclick="switchTab('incomes')">💰 Доходы</button>
    <button class="tab" onclick="switchTab('chat')">🤖 AI</button>
  </div>

  <div class="content">
    <!-- ДАШБОРД -->
    <div id="dashboard" class="section active">
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Доход за месяц</div><div class="value" id="st-month">0 ₽</div></div>
        <div class="stat-card" style="border-color:#e74c3c"><div class="label">Налог</div><div class="value" id="st-tax">0 ₽</div></div>
      </div>
      <button class="btn btn-primary" onclick="openModal('income-modal')">+ Добавить доход</button>
    </div>

    <!-- ДОХОДЫ -->
    <div id="incomes" class="section">
      <div class="card">
        <h2>История доходов</h2>
        <table><thead><tr><th>Дата</th><th>Описание</th><th>Сумма</th><th></th></tr></thead><tbody id="inc-list"></tbody></table>
      </div>
    </div>

    <!-- ЧАТ -->
    <div id="chat" class="section">
      <div class="card">
        <h2>AI-помощник</h2>
        <div class="chat-messages" id="chat-box"></div>
        <div style="display:flex; gap:10px;">
          <input type="text" id="chat-in" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px;" placeholder="Вопрос...">
          <button class="btn btn-primary" onclick="sendChat()">Отправить</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКА ДОХОДА -->
<div class="modal" id="income-modal">
  <div class="modal-content">
    <h3>Новый доход</h3>
    <input type="text" id="f-desc" placeholder="Описание" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:6px;">
    <input type="number" id="f-amount" placeholder="Сумма" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:6px;">
    <select id="f-type" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:6px;">
      <option value="individual">Физлицо (4%)</option>
      <option value="legal">Юрлицо (6%)</option>
    </select>
    <div style="text-align:right; margin-top:15px;">
      <button class="btn" onclick="closeModal('income-modal')">Отмена</button>
      <button class="btn btn-primary" onclick="submitIncome()">Сохранить</button>
    </div>
  </div>
</div>

<script>
// === НАСТРОЙКИ ===
const API_URL = 'https://katrtrtrtrtrtrtr-self-employed-helper.hf.space';
let token = localStorage.getItem('authToken');

// === АВТОРИЗАЦИЯ ===
async function doLogin() {
  const e = document.getElementById('login-email').value;
  const p = document.getElementById('login-pass').value;
  try {
    const r = await fetch(`${API_URL}/login?email=${e}&password=${p}`, {method:'POST'});
    if(!r.ok) throw new Error('Ошибка входа');
    const d = await r.json();
    saveAuth(d.access_token, e);
  } catch(err) { alert(err.message); }
}

async function doRegister() {
  const e = document.getElementById('login-email').value;
  const p = document.getElementById('login-pass').value;
  try {
    const r = await fetch(`${API_URL}/register`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email:e, password:p})
    });
    if(!r.ok) throw new Error('Ошибка регистрации');
    const d = await r.json();
    saveAuth(d.access_token, e);
  } catch(err) { alert(err.message); }
}

function saveAuth(t, email) {
  token = t;
  localStorage.setItem('authToken', t);
  localStorage.setItem('userEmail', email);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-content').style.display = 'block';
  document.getElementById('user-email').textContent = email;
  loadData();
}

function doLogout() {
  localStorage.clear();
  location.reload();
}

// === ЗАПРОСЫ ===
async function api(path, method='GET', body=null) {
  const h = {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'};
  const r = await fetch(API_URL + path, {method, headers:h, body: body ? JSON.stringify(body) : null});
  if(r.status===401) doLogout();
  return r.json();
}

// === ЛОГИКА ===
async function loadData() {
  const inc = await api('/incomes');
  const stats = await api('/stats/summary');
  
  // Статистика
  document.getElementById('st-month').textContent = Math.round(stats.month_total) + ' ₽';
  document.getElementById('st-tax').textContent = Math.round(stats.month_tax) + ' ₽';
  
  // Таблица
  const tbody = document.getElementById('inc-list');
  tbody.innerHTML = inc.map(i => 
    `<tr><td>${i.date}</td><td>${i.description}</td><td>${i.amount} ₽</td><td>${i.tax_rate}%</td></tr>`
  ).join('');
}

async function submitIncome() {
  const desc = document.getElementById('f-desc').value;
  const amount = document.getElementById('f-amount').value;
  const type = document.getElementById('f-type').value;
  
  if(!desc || !amount) return alert('Заполните поля');
  
  await api('/incomes', 'POST', {
    date: new Date().toISOString().slice(0,10),
    description: desc,
    amount: parseFloat(amount),
    client_type: type
  });
  
  closeModal('income-modal');
  loadData();
  alert('Сохранено!');
}

async function sendChat() {
  const txt = document.getElementById('chat-in').value;
  if(!txt) return;
  
  const box = document.getElementById('chat-box');
  box.innerHTML += `<div class="msg user">${txt}</div>`;
  document.getElementById('chat-in').value = '';
  
  const res = await api('/chat/send', 'POST', {text: txt});
  box.innerHTML += `<div class="msg bot">${res.reply}</div>`;
  box.scrollTop = box.scrollHeight;
}

// === УТИЛИТЫ ===
function switchTab(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// Старт
if(token) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-content').style.display = 'block';
  document.getElementById('user-email').textContent = localStorage.getItem('userEmail');
  loadData();
}
</script>
</body>
</html>
